<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>RouteMate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0e2a47;
      --navy-light: #1c4468;
      --sky: #eaf3fa;
      --card: #ffffff;
      --line: #cddde9;
      --soft: #5a7189;
      --sunset: #ff6b35;
      --sunset-dark: #e6541f;
      --sunset-tint: #ffe9df;
      --error: #b3261e;
      --font-display: "Sora", "Segoe UI", sans-serif;
      --font-body: "Nunito Sans", "Segoe UI", sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html, body { height: 100%; }

    body {
      background: var(--sky);
      color: var(--navy);
      font-family: var(--font-body);
      font-size: 16px;
      line-height: 1.6;
    }

    .app {
      display: flex;
      flex-direction: column;
      max-width: 820px;
      height: 100%;
      margin: 0 auto;
      background: var(--card);
      border-left: 1px solid var(--line);
      border-right: 1px solid var(--line);
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--navy);
      border-bottom: 4px solid var(--sunset);
      color: #ffffff;
      padding: 16px 24px;
    }

    .brand h1 {
      font-family: var(--font-display);
      font-size: 1.5rem;
      font-weight: 700;
      line-height: 1.15;
    }

    .brand p {
      color: #b9cde0;
      font-size: 0.88rem;
    }

    .clear-btn {
      background: none;
      border: 1px solid #4a6a8a;
      border-radius: 8px;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-size: 0.9rem;
      padding: 6px 14px;
    }

    .clear-btn:hover { background: var(--navy-light); border-color: #ffffff; }

    main {
      flex: 1;
      overflow-y: auto;
      padding: 24px;
    }

    .welcome h2 {
      font-family: var(--font-display);
      font-size: 2rem;
      font-weight: 600;
      line-height: 1.2;
      margin-bottom: 8px;
    }

    .welcome p {
      color: var(--soft);
      max-width: 52ch;
    }

    .suggestions {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 12px;
      margin-top: 24px;
    }

    .suggestions button {
      background: var(--card);
      border: 1px solid var(--line);
      border-left: 5px solid var(--sunset);
      border-radius: 8px;
      color: var(--navy);
      cursor: pointer;
      font: inherit;
      font-size: 0.95rem;
      font-weight: 600;
      padding: 12px 14px;
      text-align: left;
    }

    .suggestions button:hover { background: var(--sunset-tint); }

    .message {
      display: flex;
      margin-bottom: 18px;
    }

    .message.user { justify-content: flex-end; }

    .bubble {
      max-width: 85%;
      padding: 12px 16px;
      border-radius: 14px;
      overflow-wrap: anywhere;
    }

    .user .bubble {
      background: var(--navy);
      border-bottom-right-radius: 4px;
      color: #ffffff;
      white-space: pre-wrap;
    }

    .assistant .bubble {
      background: var(--sky);
      border: 1px solid var(--line);
      border-bottom-left-radius: 4px;
    }

    .assistant .bubble.error {
      border-color: var(--error);
      color: var(--error);
    }

    .bubble p + p,
    .bubble p + ul,
    .bubble p + ol,
    .bubble ul + p,
    .bubble ol + p,
    .bubble pre + p,
    .bubble p + pre { margin-top: 10px; }

    .bubble h4 {
      border-bottom: 2px dashed var(--sunset);
      font-family: var(--font-display);
      font-size: 1rem;
      margin-top: 12px;
      padding-bottom: 2px;
    }

    .bubble h4:first-child { margin-top: 0; }

    .bubble ul, .bubble ol { padding-left: 22px; }

    .bubble li::marker { color: var(--sunset-dark); font-weight: 700; }

    .bubble code {
      background: #d7e6f2;
      border-radius: 4px;
      font-family: Consolas, Menlo, monospace;
      font-size: 0.9em;
      padding: 1px 5px;
    }

    .bubble pre {
      background: var(--navy);
      border-radius: 8px;
      color: #eaf3fa;
      margin-top: 10px;
      overflow-x: auto;
      padding: 12px 14px;
    }

    .bubble pre code { background: none; color: inherit; padding: 0; }

    .typing { display: flex; gap: 5px; padding: 6px 0; }

    .typing span {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--sunset);
      animation: blink 1.2s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.2s; }
    .typing span:nth-child(3) { animation-delay: 0.4s; }

    @keyframes blink {
      0%, 80%, 100% { opacity: 0.25; }
      40% { opacity: 1; }
    }

    footer {
      border-top: 2px dashed var(--line);
      padding: 16px 24px 20px;
    }

    .composer {
      display: flex;
      align-items: flex-end;
      gap: 10px;
    }

    textarea {
      flex: 1;
      background: var(--sky);
      border: 1px solid var(--line);
      border-radius: 12px;
      color: var(--navy);
      font: inherit;
      max-height: 160px;
      padding: 12px 14px;
      resize: none;
    }

    textarea:focus { border-color: var(--navy); outline: none; }

    .send-btn {
      background: var(--sunset);
      border: none;
      border-radius: 12px;
      color: #ffffff;
      cursor: pointer;
      font: inherit;
      font-weight: 700;
      padding: 12px 22px;
    }

    .send-btn:hover { background: var(--sunset-dark); }
    .send-btn:disabled { cursor: not-allowed; opacity: 0.5; }

    button:focus-visible { outline: 3px solid var(--sunset); outline-offset: 2px; }

    .note {
      color: var(--soft);
      font-size: 0.8rem;
      margin-top: 8px;
      text-align: center;
    }

    @media (max-width: 600px) {
      header, main, footer { padding-left: 14px; padding-right: 14px; }
      .bubble { max-width: 94%; }
      .welcome h2 { font-size: 1.6rem; }
      .suggestions { grid-template-columns: 1fr; }
    }

    @media (prefers-reduced-motion: reduce) {
      .typing span { animation: none; opacity: 0.6; }
    }
  </style>
</head>
<body>
  <div class="app">
    <header>
      <div class="brand">
        <h1>RouteMate</h1>
        <p>Travel and tourism assistant</p>
      </div>
      <button class="clear-btn" id="clearBtn" type="button">New chat</button>
    </header>

    <main id="chat">
      <section class="welcome" id="welcome">
        <h2>Where are you headed next?</h2>
        <p>Ask about destinations, itineraries, transport, stays, budgets, or what to pack.</p>
        <div class="suggestions">
          <button type="button">Plan a 5-day trip to Kerala</button>
          <button type="button">When is the best time to visit Japan?</button>
          <button type="button">Packing list for a Himalayan trek</button>
          <button type="button">Budget tips for backpacking in Europe</button>
        </div>
      </section>
    </main>

    <footer>
      <div class="composer">
        <textarea id="input" rows="1" maxlength="2000" placeholder="Ask a travel question"></textarea>
        <button class="send-btn" id="sendBtn" type="button">Send</button>
      </div>
      <p class="note">Prices and rules change. Confirm visas, fares, and bookings with official sources.</p>
    </footer>
  </div>

  <script>
    const chat = document.getElementById("chat");
    const welcome = document.getElementById("welcome");
    const input = document.getElementById("input");
    const sendBtn = document.getElementById("sendBtn");
    const clearBtn = document.getElementById("clearBtn");

    let messages = [];
    let isWaiting = false;

    function escapeHtml(text) {
      return text
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatInline(text) {
      return text
        .replace(/`([^`]+)`/g, "<code>$1</code>")
        .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
    }

    function formatBlock(block) {
      let html = "";
      let openList = null;

      const closeList = () => {
        if (openList) {
          html += `</${openList}>`;
          openList = null;
        }
      };

      for (const rawLine of block.split("\n")) {
        const line = rawLine.trim();
        const bullet = line.match(/^[-*]\s+(.*)/);
        const numbered = line.match(/^\d+\.\s+(.*)/);
        const heading = line.match(/^#{1,4}\s+(.*)/);

        if (bullet || numbered) {
          const tag = bullet ? "ul" : "ol";
          if (openList !== tag) {
            closeList();
            html += `<${tag}>`;
            openList = tag;
          }
          html += `<li>${formatInline((bullet || numbered)[1])}</li>`;
        } else {
          closeList();
          if (heading) {
            html += `<h4>${formatInline(heading[1])}</h4>`;
          } else if (line) {
            html += `<p>${formatInline(line)}</p>`;
          }
        }
      }

      closeList();
      return html;
    }

    function formatReply(text) {
      const parts = escapeHtml(text).split(/```(?:\w+)?\n?([\s\S]*?)```/g);
      return parts
        .map((part, index) => (index % 2 === 1 ? `<pre><code>${part}</code></pre>` : formatBlock(part)))
        .join("");
    }

    function addMessage(role, content, isError = false) {
      const wrapper = document.createElement("div");
      wrapper.className = `message ${role}`;

      const bubble = document.createElement("div");
      bubble.className = "bubble" + (isError ? " error" : "");

      if (role === "user") {
        bubble.textContent = content;
      } else {
        bubble.innerHTML = formatReply(content);
      }

      wrapper.appendChild(bubble);
      chat.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    function addTypingIndicator() {
      const wrapper = document.createElement("div");
      wrapper.className = "message assistant";
      wrapper.innerHTML = '<div class="bubble"><div class="typing"><span></span><span></span><span></span></div></div>';
      chat.appendChild(wrapper);
      scrollToBottom();
      return wrapper;
    }

    function scrollToBottom() {
      chat.scrollTop = chat.scrollHeight;
    }

    function setWaiting(state) {
      isWaiting = state;
      sendBtn.disabled = state;
    }

    function resizeInput() {
      input.style.height = "auto";
      input.style.height = `${input.scrollHeight}px`;
    }

    async function sendMessage(text) {
      const message = text.trim();
      if (!message || isWaiting) return;

      welcome.style.display = "none";
      addMessage("user", message);
      messages.push({ role: "user", content: message });

      input.value = "";
      resizeInput();
      setWaiting(true);

      const typing = addTypingIndicator();

      try {
        const response = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ messages })
        });
        const data = await response.json();
        typing.remove();

        if (!response.ok) {
          messages.pop();
          addMessage("assistant", data.error || "Something went wrong. Please try again.", true);
        } else {
          messages.push({ role: "assistant", content: data.reply });
          addMessage("assistant", data.reply);
        }
      } catch (error) {
        typing.remove();
        messages.pop();
        addMessage("assistant", "Could not reach the server. Check your connection and try again.", true);
      } finally {
        setWaiting(false);
        input.focus();
      }
    }

    function resetChat() {
      messages = [];
      chat.querySelectorAll(".message").forEach((node) => node.remove());
      welcome.style.display = "";
      input.focus();
    }

    sendBtn.addEventListener("click", () => sendMessage(input.value));
    clearBtn.addEventListener("click", resetChat);
    input.addEventListener("input", resizeInput);

    input.addEventListener("keydown", (event) => {
      if (event.key === "Enter" && !event.shiftKey) {
        event.preventDefault();
        sendMessage(input.value);
      }
    });

    document.querySelectorAll(".suggestions button").forEach((button) => {
      button.addEventListener("click", () => sendMessage(button.textContent));
    });

    input.focus();
  </script>
</body>
</html>
